[package]

# Semantic Versioning is used: https://semver.org/
version = "0.1.0"

# Description
category = "isaaclab"
readme  = "README.md"

title = "Extension Template"
author = "Isaac Lab Project Developers"
maintainer = "Isaac Lab Project Developers"
description="Extension Template for Isaac Lab"
repository = "https://github.com/isaac-sim/IsaacLab.git"
keywords = ["extension", "template", "isaaclab"]

[dependencies]
"isaaclab" = {}
"isaaclab_assets" = {}
"isaaclab_mimic" = {}
"isaaclab_rl" = {}
"isaaclab_tasks" = {}
# NOTE: Add additional dependencies here

[[python.module]]
name = "digital_twin_colibri_g1"

[isaaclab_settings]
# APT dependencies for ROS2 integration (Phase 6: Sim2Sim)
# These are installed automatically by Isaac Lab's install_deps.py script
apt_deps = [
    # ROS2 Humble packages (will be installed via apt if available)
    # Note: In Docker, these are already installed in Stage 2
    # For native installation, ensure ROS2 Humble is installed first
]

# Python package dependencies via pipapi
# Note: rclpy is in setup.py INSTALL_REQUIRES
# ROS2 message packages (geometry_msgs, nav_msgs, etc.) are installed via apt, not pip
# They use the system ROS2 installation

[python.pipapi]
requirements = [
    "hydra-core",  # For configuration management in sim2sim
]

modules = [
    "hydra",
]

use_online_index = true