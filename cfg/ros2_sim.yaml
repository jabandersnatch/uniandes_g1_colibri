# ROS2 Sim2Sim Configuration for Colibri G1 Digital Twin
# Phase 6: Sim2Sim ROS2 Integration

# Simulation Settings
num_envs: 1 # Single robot for sim2sim (required)
freq: 50 # Control frequency in Hz
episode_length_s: null # Infinite (continuous operation)

# Scene Settings
scene:
  env_spacing: 0.0 # No spacing needed (single robot)
  camera_follow: true # Camera tracks robot in GUI

# ROS2 Settings
ros2:
  namespace: "colibri_g1" # Topic namespace
  publish_tf: true # Enable TF broadcasting
  publish_clock: true # Publish simulation time
  publish_rate: 25 # Hz (for odometry, joint states)
  goal_marker_rate: 1 # Hz (for goal visualization)
  enable_cmd_vel_override: false # Allow external velocity commands

# Policy Settings
policy:
  # Path to trained checkpoint (relative to project root)
  # IMPORTANT: Use checkpoint trained with goal_position observation (125 obs)
  # 2025-11-11_10-29-02 run: 125 obs (WITH goal_position) ✓
  # 2025-11-09_16-20-14 run: 123 obs (WITHOUT goal_position) ✗
  checkpoint: "logs/rsl_rl/g1_flat/2025-11-11_10-29-02/model_900.pt"
  device: "cuda" # "cuda" or "cpu"
  deterministic: true # No exploration noise during deployment

# Sensor Settings
sensor:
  enable_camera: true # RGB/depth camera for visualization
  enable_lidar: true # RTX LiDAR for social navigation

  # Camera configuration
  # Mounted on torso for forward-facing view (similar to Go2 setup)
  camera:
    width: 640
    height: 480
    fov: 90 # Field of view in degrees
    frame_id: "front_cam"
    parent_link: "torso_link" # Mount on torso (stable, forward-facing)
    translation: [0.3, 0.0, 0.3] # Forward and up from torso
    frequency: 50 # Camera capture frequency (Hz) - matches simulation frequency
    color_image: true # Publish RGB image
    depth_image: true # Publish depth image

  # RTX LiDAR configuration
  # Uses Hesai XT32 (32-channel) for 360-degree environmental scanning
  # Mounted on torso_link (like Go2's base) for consistent frame
  lidar:
    config: "Hesai_XT32_SD10" # RTX LiDAR preset (32-channel, 10Hz rotation)
    parent_link: "torso_link" # Mount on torso (stable reference frame)
    translation: [0.2, 0.0, 0.4] # Forward and up from torso (above camera)
    orientation: [1.0, 0.0, 0.0, 0.0] # Identity quaternion (w, x, y, z)
    frame_id: "lidar_link" # ROS2 TF frame name
    publish_rate: 15 # Point cloud publish rate in Hz
    min_range: 0.5 # Minimum range in meters (filters self-intersection with robot body)
    max_range: 100.0 # Maximum range in meters

# Environment Settings
environment:
  use_custom_usd: true
  usd_path: "assets/colivriLab/ColibriBuilding.usd" # Path to Colibri Lab scene

# Debug Settings
debug:
  visualize_goals: true # Show goal markers in Isaac Sim
  print_diagnostics: false # Print ROS2 publish rates and diagnostics
  record_video: false # Record simulation video
  video_interval: 1000 # Record every N steps

# Performance Settings
performance:
  render_interval: 4 # Render every N simulation steps (decimation)
  headless: false # Run without GUI (set to true for better performance)

# Note: This configuration extends DigitalTwinColibriG1EnvCfg_PLAY
# The following settings are inherited and do NOT need to be specified here:
#   - Observations (includes goal position in base frame)
#   - Actions (29 DOF joint position targets)
#   - Rewards (goal distance, heading alignment, locomotion quality)
#   - Commands (SimpleGoalCommand for autonomous goals, GoalDirectedVelocityCommand)
